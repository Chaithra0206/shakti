name: Build Android Release APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Prepare Secrets Configuration
        run: |
          mkdir -p lib/config
          if [ ! -f lib/config/secrets.dart ]; then
            cp lib/config/secrets.example.dart lib/config/secrets.dart
          fi

      - name: Build Release APK
        env:
          NEON_DB_URL: ${{ secrets.NEON_DB_URL }}
        run: |
          if [ -n "$NEON_DB_URL" ]; then
            flutter build apk --release --dart-define=NEON_DB_URL="$NEON_DB_URL"
          else
            flutter build apk --release
          fi

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Offline-SOS-Bridge-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
